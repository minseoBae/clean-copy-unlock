<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Clean Copy Unlock</title>
<style>
  body {
    width: 220px;
    padding: 16px;
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    color: #222;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #ccc;
    border-radius: 22px;
    transition: 0.2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    left: 3px;
    top: 3px;
    background-color: #fff;
    border-radius: 50%;
    transition: 0.2s;
  }
  input:checked + .slider {
    background-color: #2ecc71;
  }
  input:checked + .slider::before {
    transform: translateX(18px);
  }
  #status {
    margin-top: 10px;
    font-size: 12px;
    color: #666;
  }
</style>
</head>
<body>
  <div class="row">
    <span>우클릭/복사 해제</span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>
  <div id="status">상태 확인 중...</div>
  <script src="popup.js"></script>
</body>
</html>
